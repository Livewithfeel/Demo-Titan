<h2>Forgot Password</h2>

{% if messages %}
  {% for message in messages %}
    <p style="color: green;">{{ message }}</p>
  {% endfor %}
{% endif %}

<form method="post">
  {% csrf_token %}
  <input type="email" name="email" placeholder="Your Email" required><br><br>
  <button type="submit">Submit</button>
</form>
